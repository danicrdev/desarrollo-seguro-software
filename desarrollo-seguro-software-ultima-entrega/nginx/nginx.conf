events { worker_connections 256; }
http {
  server_tokens off;
  server {
    listen 80;
    server_name localhost;
    return 308 https://localhost:8443$request_uri;
  }
  server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    client_max_body_size 32k;
    proxy_read_timeout 20s;
    # Excepción de CSP para Swagger UI del laboratorio (scripts CDN); no habilitar en producción.
    location = /docs {
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      proxy_pass http://app:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
    location / {
      proxy_pass http://app:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
